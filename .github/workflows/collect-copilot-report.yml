name: Collect Copilot discovery report
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR containing the GitHub-hosted Copilot discovery report
        required: true
        type: string
      report_timestamp:
        description: Report folder timestamp (YYYYMMDDTHHMMSSZ)
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Collect reports from immutable PR head
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPORT_TIMESTAMP: ${{ inputs.report_timestamp }}
        run: python3 scripts/collect_copilot_report.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: copilot-discovery-${{ inputs.pr_number }}-${{ inputs.report_timestamp }}
          path: collected-copilot-report/
          if-no-files-found: error
          retention-days: 90
