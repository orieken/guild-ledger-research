name: Independent T01 acceptance evaluator
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'evaluators/T01/**'
      - 'benchmarks/T01/starter/**'
      - 'benchmarks/T01/validation/**'
      - 'scripts/package_benchmark.py'
      - 'scripts/t01_harness_smoke.py'
      - 'scripts/tests/test_t01_acceptance_evaluator.py'
      - '.github/workflows/t01-acceptance-evaluator.yml'
  pull_request:
    paths:
      - 'evaluators/T01/**'
      - 'benchmarks/T01/starter/**'
      - 'benchmarks/T01/validation/**'
      - 'scripts/package_benchmark.py'
      - 'scripts/t01_harness_smoke.py'
      - 'scripts/tests/test_t01_acceptance_evaluator.py'
      - '.github/workflows/t01-acceptance-evaluator.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify score integrity and agent-input exclusion
        run: python3 -B scripts/tests/test_t01_acceptance_evaluator.py
      - name: Validate reference implementations, controls and seeded defects
        run: python3 -B evaluators/T01/verify.py --build --output ci-acceptance-results
      - name: Retain evaluator validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: t01-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-acceptance-results/
          retention-days: 30
          if-no-files-found: error
